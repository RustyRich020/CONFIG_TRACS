credential_provider:
  provider_id: microsoft_graph_sharepoint_excel
  display_name: Microsoft Graph SharePoint Excel Token Provider
  provider_type: microsoft_graph_token
  applies_to_connector_types:
    - sharepoint_excel
  secret_handling: server_environment_only
  required_environment:
    token: TRACS_GRAPH_TOKEN
  rotation_evidence:
    rotated_at: TRACS_GRAPH_TOKEN_ROTATED_AT
    max_age_days: TRACS_GRAPH_TOKEN_MAX_AGE_DAYS
    default_max_age_days: 90
    rotated_at_format: ISO-8601
  validation:
    api_route: /api/connectors/{connectorId}/credential-validation
    expected_checks:
      - credential_presence
      - token_rotation
    blocking_when_missing:
      - TRACS_GRAPH_TOKEN
  metadata_discovery:
    api_route: /api/connectors/{connectorId}/metadata
    mode: credential_aware_backend_adapter
    fallback_without_credentials: warning_evidence_from_manifest
  least_privilege_guidance:
    target_resources:
      - SharePoint site
      - Document library
      - Workbook
      - Worksheet
    recommended_scope_review:
      - Read only workbook access for metadata discovery and source preview
      - Separate write-capable app registration only if future connector actions require it
  governance:
    owner_role: Microsoft 365 Administrator
    approval_role: Quality Systems Owner
    evidence_retention: persist_credential_validation_record
  notes:
    - Do not store Graph access tokens or refresh tokens in committed connector YAML.
    - Configure token material only on the backend API host or deployment secret store.
    - Rotate tokens outside TRACS, then update rotated-at evidence and rerun validation.
