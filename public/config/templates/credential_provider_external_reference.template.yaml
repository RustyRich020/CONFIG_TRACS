credential_provider:
  provider_id: external_reference_api
  display_name: External Reference API Credential Provider
  provider_type: external_reference_token
  applies_to_connector_types:
    - external_reference
    - rest_api
  secret_handling: server_environment_only
  required_environment:
    base_url: TRACS_EXTERNAL_API_BASE_URL
    token: TRACS_EXTERNAL_API_TOKEN
  optional_environment:
    tenant_id: TRACS_EXTERNAL_API_TENANT_ID
    client_id: TRACS_EXTERNAL_API_CLIENT_ID
    audience: TRACS_EXTERNAL_API_AUDIENCE
  rotation_evidence:
    rotated_at: TRACS_EXTERNAL_API_TOKEN_ROTATED_AT
    max_age_days: TRACS_EXTERNAL_API_TOKEN_MAX_AGE_DAYS
    default_max_age_days: 90
    rotated_at_format: ISO-8601
  validation:
    api_route: /api/connectors/{connectorId}/credential-validation
    expected_checks:
      - credential_presence
      - token_rotation
      - endpoint_reachability
    blocking_when_missing:
      - TRACS_EXTERNAL_API_BASE_URL
      - TRACS_EXTERNAL_API_TOKEN
    implementation_status: implemented_dry_run_safe
  metadata_discovery:
    api_route: /api/connectors/{connectorId}/metadata
    mode: credential_aware_backend_adapter
    fallback_without_credentials: warning_evidence_from_manifest
    connector_fields:
      metadata_path: /metadata/resource-name
      key_fields:
        - external_id
        - status
  row_preview:
    api_route: /api/connectors/{connectorId}/preview
    mode: credential_aware_backend_adapter
    connector_fields:
      preview_path: /records/resource-name?limit={limit}
      source_object: resource-name
    max_preview_rows: 50
    fallback_without_credentials: warning_evidence_without_rows
  request_policy:
    timeout_seconds: 30
    retry_attempts: 2
    allowed_methods:
      - GET
  governance:
    owner_role: Integration Owner
    approval_role: Quality Systems Owner
    evidence_retention: persist_credential_validation_record
  notes:
    - Use this template for vendor APIs, reference systems, and non-native REST connectors.
    - Do not store bearer tokens, API keys, client secrets, or endpoint secrets in committed YAML.
    - Add a dedicated backend adapter before enabling live external extraction.
