credential_provider:
  provider_id: snowflake_sql_api
  display_name: Snowflake SQL API Token Provider
  provider_type: snowflake_sql_api_token
  applies_to_connector_types:
    - snowflake
  secret_handling: server_environment_only
  required_environment:
    account_url: TRACS_SNOWFLAKE_ACCOUNT_URL
    account_alias: TRACS_SNOWFLAKE_ACCOUNT
    token: TRACS_SNOWFLAKE_TOKEN
  rotation_evidence:
    rotated_at: TRACS_SNOWFLAKE_TOKEN_ROTATED_AT
    max_age_days: TRACS_SNOWFLAKE_TOKEN_MAX_AGE_DAYS
    default_max_age_days: 90
    rotated_at_format: ISO-8601
  validation:
    api_route: /api/connectors/{connectorId}/credential-validation
    expected_checks:
      - credential_presence
      - token_rotation
    blocking_when_missing:
      - TRACS_SNOWFLAKE_ACCOUNT_URL or TRACS_SNOWFLAKE_ACCOUNT
      - TRACS_SNOWFLAKE_TOKEN
  metadata_discovery:
    api_route: /api/connectors/{connectorId}/metadata
    mode: credential_aware_backend_adapter
    fallback_without_credentials: warning_evidence_from_manifest
  governance:
    owner_role: Data Platform Owner
    approval_role: Quality Systems Owner
    evidence_retention: persist_credential_validation_record
  notes:
    - Do not store account URLs, tokens, or rotated-at values in committed connector YAML.
    - Configure environment values only on the backend API host or deployment secret store.
    - Rotate tokens outside TRACS, then update rotated-at evidence and rerun validation.
