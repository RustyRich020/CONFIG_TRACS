workflow_definitions:
  closure_sla:
    display_name: Closure SLA
    description: Governance workflow for Closure SLA packages, delivery acknowledgements, follow-up routing, closure, and evidence retention.
    applicable_domains:
      - quality
      - qms
      - reporting_bi
    default_owner_role: Quality Governance Reviewer
    sla_days: 7
    stages:
      - source
      - package
      - delivery
      - acknowledgement
      - closure
      - closeout
      - final_evidence
    allowed_next_stages:
      source:
        - package
        - closure
      package:
        - delivery
      delivery:
        - acknowledgement
      acknowledgement:
        - closure
        - closeout
      closure:
        - closeout
        - final_evidence
      closeout:
        - final_evidence
      final_evidence: []
    parent_link_fields:
      - parentRecordId
      - deliveryRecordId
      - closureRecordId
      - packageRecordId
    export_package:
      enabled: true
      label: Closure SLA governance package
      evidence_required: true
    owner_resolution:
      - owner
      - reviewer
      - reviewers
      - actor

  notification_governance:
    display_name: Notification Governance
