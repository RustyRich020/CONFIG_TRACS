      acknowledgement:
        - closure
      closure:
        - final_evidence
      final_evidence: []
    parent_link_fields:
      - parentRecordId
      - deliveryRecordId
      - responseRecordId
    export_package:
      enabled: true
      label: Notification governance package
      evidence_required: true
    owner_resolution:
      - messagingOwners
      - recipients
      - owner
      - reviewer

  notification_retry_queue:
