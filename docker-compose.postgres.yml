services:
  tracs-postgres:
    image: postgres:16-alpine
    container_name: tracs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracs
      POSTGRES_USER: tracs_app
      POSTGRES_PASSWORD: tracs_dev_password
    ports:
      - "55432:5432"
    volumes:
      - tracs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracs_app -d tracs"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  tracs-postgres-data:
